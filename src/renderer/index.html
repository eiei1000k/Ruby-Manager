<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
  <title>Ruby Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="sq" style="--c:var(--red)">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/></svg>
        </span>
        <div>
          <div class="brand-name">Ruby Manager</div>
          <div class="brand-sub" id="brand-sub">スキャン中…</div>
        </div>
      </div>
      <div class="search" id="side-search"></div>
      <div class="side-scroll">
        <div id="nav"></div>
        <div id="side-projects"></div>
      </div>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <main class="main">
      <header class="topbar" id="topbar">
        <div>
          <h1 id="view-title">概要</h1>
          <div class="subtitle" id="view-sub"></div>
        </div>
        <div class="top-actions" id="top-actions"></div>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>
  <section id="log"></section>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
