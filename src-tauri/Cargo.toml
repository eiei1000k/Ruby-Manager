[package]
name = "ruby-manager"
version = "0.2.0"
description = "Ruby のバージョンとリポジトリごとの Bundler を視覚的に管理するデスクトップアプリ"
authors = ["eiei1000k"]
license = "MIT"
repository = "https://github.com/eiei1000k/Ruby-Manager"
edition = "2021"
rust-version = "1.80"

[lib]
name = "ruby_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
